name: Feature request
description: Suggest a setup, data source, broker adapter or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve for a trader?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: Commands, output, which skill it belongs to
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Free public data source (if any)
      description: Link to the NSE/BSE/SEBI page or endpoint
